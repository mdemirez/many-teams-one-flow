site_name: Many Teams, One Flow
site_description: A practitioner's playbook for the development value stream. A synthesis of existing work.
site_url: https://mdemirez.github.io/many-teams-one-flow/
repo_url: https://github.com/mdemirez/many-teams-one-flow
repo_name: many-teams-one-flow
copyright: Licensed under CC BY 4.0

theme:
  name: material
  features:
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - sane_lists
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 1. Problem, Purpose and Scope: 01-purpose-and-scope.md
  - 2. Positioning, Influences, and Trade-offs: 02-positioning-influences-and-trade-offs.md
  - 3. Principles: 03-principles.md
  - 4. Operating Model: 04-operating-model.md
  - 5. Roles and Team Topology: 05-roles-and-team-topology.md
  - 6. Shaping Track: 06-shaping-track.md
  - 7. Delivery Track: 07-delivery-track.md
  - 8. Architectural Evolution: 08-architectural-evolution.md
  - 9. Definitions of Ready and Done: 09-definitions-of-ready-and-done.md
  - 10. Documentation Model: 10-documentation-model.md
  - "11. Looking Ahead: AI-Assisted Delivery": 11-looking-ahead.md
  - 12. References: 12-references.md
